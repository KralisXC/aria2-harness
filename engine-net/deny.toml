# Q7 许可证审计（engine-net 独立 crate，W2 接法 → 逐 crate 审计）
# 与 client/src-host/deny.toml 保持同一口径。
# 运行：在 engine-net 目录执行 cargo deny check licenses
[licenses]
version = 2
confidence-threshold = 0.8
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
# MPL-2.0 为文件级弱 copyleft：不修改源码、仅作依赖链接，可随闭源程序分发。
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
]
